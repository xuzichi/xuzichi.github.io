<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片拼接</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <style>
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      border-radius: 5px;
      color: white;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .toast.success {
      background-color: #28a745;
    }

    .toast.error {
      background-color: #dc3545;
    }

    .dropzone.dragover {
      background-color: #eff6ff;
      border-color: #3b82f6;
    }
  </style>
</head>

<body class="bg-gray-100 p-4 min-h-screen">
  <div class="container mx-auto max-w-6xl">
    <!-- 顶部标题栏 -->
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">
        <i class="fas fa-images text-blue-500 mr-2"></i>图片拼接
      </h1>
      <a href="index.html" class="text-blue-600 hover:underline">
        <i class="fas fa-home mr-1"></i>返回首页
      </a>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 左栏：上传 + 图片列表 -->
      <div>
        <!-- 上传区：点击多选 / 拖拽 / 粘贴 -->
        <div id="dropzone"
          class="border-2 border-dashed border-gray-300 rounded-lg bg-white p-8 text-center cursor-pointer hover:border-blue-400 transition-colors">
          <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
          <p class="text-gray-600 font-medium">点击选择图片，或将图片拖拽到此处</p>
          <p class="text-gray-400 text-sm mt-1">支持多选；也可以在页面任意位置 Ctrl+V 粘贴截图</p>
          <p class="text-gray-400 text-xs mt-2">支持 PNG / JPG / WebP 等常见格式（GIF 仅取第一帧）</p>
          <input type="file" id="file-input" multiple accept="image/*" class="hidden">
        </div>

        <!-- 图片列表 -->
        <div id="image-list" class="mt-4 flex flex-wrap gap-3"></div>
        <p id="total-info" class="text-sm text-gray-500 mt-3"></p>
      </div>

      <!-- 右栏：设置 + 结果 -->
      <div>
        <!-- 设置面板 -->
        <div class="bg-white rounded-lg shadow-sm p-5 mb-6">
          <h2 class="font-bold text-gray-800 mb-4">
            <i class="fas fa-sliders-h text-gray-500 mr-2"></i>拼接设置
          </h2>

          <!-- 拼接方向 -->
          <div class="mb-4">
            <label class="block text-sm text-gray-600 mb-2">拼接方向</label>
            <div class="flex gap-2">
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="direction" value="horizontal" checked class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500">横向</span>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="direction" value="vertical" class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500">纵向</span>
              </label>
            </div>
          </div>

          <!-- 导出格式 -->
          <div class="mb-4">
            <label class="block text-sm text-gray-600 mb-2">导出格式</label>
            <div class="flex gap-2">
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="format" value="png" checked class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500">PNG</span>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="format" value="jpeg" class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500">JPG</span>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="format" value="webp" class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500">WebP</span>
              </label>
            </div>
          </div>

          <!-- 质量滑块 -->
          <div class="mb-4">
            <div class="flex justify-between items-center mb-2">
              <label for="quality" class="text-sm text-gray-600">质量</label>
              <span id="quality-label" class="text-sm text-gray-700 font-medium">90%</span>
            </div>
            <input type="range" id="quality" min="10" max="100" step="5" value="90" class="w-full accent-blue-500">
            <p id="quality-hint" class="text-xs text-gray-400 mt-1 hidden">PNG 为无损格式，质量滑块不生效</p>
          </div>

          <!-- 对齐方式（横向=顶/中/底，纵向=左/中/右） -->
          <div class="mb-2">
            <label class="block text-sm text-gray-600 mb-2">对齐方式</label>
            <div class="flex gap-2">
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="align" value="top" checked class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500" data-align-label>顶对齐</span>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="align" value="center" class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500" data-align-label>居中</span>
              </label>
              <label class="flex-1 cursor-pointer">
                <input type="radio" name="align" value="bottom" class="hidden peer">
                <span class="block text-center py-2 rounded border border-gray-300 peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500" data-align-label>底对齐</span>
              </label>
            </div>
          </div>
        </div>

        <!-- 结果区 -->
        <div class="bg-white rounded-lg shadow-sm p-5">
          <h2 class="font-bold text-gray-800 mb-4">
            <i class="fas fa-download text-gray-500 mr-2"></i>生成结果
          </h2>
          <!-- 合并预览（按比例缩放显示） -->
          <div id="preview-wrap" class="hidden bg-gray-50 border border-gray-200 rounded p-3 mb-4 flex justify-center overflow-auto" style="max-height: 60vh;">
            <canvas id="preview-canvas" class="max-w-full h-auto"></canvas>
          </div>
          <p id="result-info" class="text-sm text-gray-500 mb-4"></p>
          <button id="merge-button" disabled
            class="w-full bg-blue-500 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded">
            <i class="fas fa-magic mr-2"></i>生成并下载
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ============ 状态 ============
    // 图片列表：{ id, name, size(字节), img(Image 元素), width, height, objectUrl }
    const images = [];
    let nextId = 1;
    // 最近一次成功生成的画布由 merge-button 点击时重新生成，无需缓存

    // 浏览器画布尺寸上限（约 16384×16384 或 1.3 亿像素，Chrome 限制）
    const MAX_DIMENSION = 16384;
    const MAX_PIXELS = 134217728;

    // ============ 工具函数 ============
    const $ = (sel) => document.querySelector(sel);

    const showToast = (message, isSuccess) => {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.remove('success', 'error');
      toast.classList.add(isSuccess ? 'success' : 'error');
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    };

    // 文件大小格式化
    const formatSize = (bytes) => {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    };

    // 当前拼接参数
    const getSettings = () => ({
      direction: document.querySelector('input[name="direction"]:checked').value,
      format: document.querySelector('input[name="format"]:checked').value,
      quality: parseInt($('#quality').value, 10) / 100,
      align: document.querySelector('input[name="align"]:checked').value
    });

    // ============ 图片添加 ============
    const addFiles = (fileList) => {
      const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
      const skipped = Array.from(fileList).length - files.length;
      if (skipped > 0) {
        showToast(`已忽略 ${skipped} 个非图片文件`, false);
      }
      files.forEach(file => {
        const item = { id: nextId++, name: file.name, size: file.size, objectUrl: URL.createObjectURL(file) };
        const img = new Image();
        img.onload = () => {
          item.img = img;
          item.width = img.naturalWidth;
          item.height = img.naturalHeight;
          renderList();
          updateTotalInfo();
          schedulePreview();
        };
        img.onerror = () => {
          URL.revokeObjectURL(item.objectUrl);
          const idx = images.indexOf(item);
          if (idx > -1) images.splice(idx, 1);
          renderList();
          updateTotalInfo();
          showToast(`无法读取图片：${file.name}`, false);
        };
        img.src = item.objectUrl;
        images.push(item);
      });
      renderList();
    };

    // ============ 图片列表渲染 ============
    const renderList = () => {
      const list = $('#image-list');
      list.innerHTML = '';
      images.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow-sm p-2 w-44';
        card.innerHTML = `
          <div class="relative mb-2 bg-gray-100 rounded flex items-center justify-center overflow-hidden" style="height: 96px;">
            <img src="${item.objectUrl}" alt="${item.name}" class="max-w-full max-h-full">
            <span class="absolute top-1 left-1 bg-blue-500 text-white text-xs px-1.5 py-0.5 rounded">第 ${index + 1} 张</span>
          </div>
          <p class="text-xs text-gray-700 truncate" title="${item.name}">${item.name}</p>
          <p class="text-xs text-gray-500">${item.width ? item.width + '×' + item.height : '加载中…'}${item.size ? ' · ' + formatSize(item.size) : ''}</p>
          <div class="flex gap-1 mt-2">
            <button data-act="up" data-id="${item.id}" class="flex-1 text-xs py-1 rounded border border-gray-300 hover:bg-gray-100" title="上移"><i class="fas fa-arrow-up"></i></button>
            <button data-act="down" data-id="${item.id}" class="flex-1 text-xs py-1 rounded border border-gray-300 hover:bg-gray-100" title="下移"><i class="fas fa-arrow-down"></i></button>
            <button data-act="remove" data-id="${item.id}" class="flex-1 text-xs py-1 rounded border border-red-300 text-red-500 hover:bg-red-50" title="移除"><i class="fas fa-trash"></i></button>
          </div>
        `;
        list.appendChild(card);
      });
      // 图片数量变化时同步生成按钮可用状态（全部加载完成才可生成）
      updateButtonState();
    };

    // 是否有图片仍在加载中
    const hasPendingLoad = () => images.some(item => !item.img);

    // 列表操作：上移 / 下移 / 移除
    $('#image-list').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = parseInt(btn.dataset.id, 10);
      const index = images.findIndex(item => item.id === id);
      if (index === -1) return;
      const act = btn.dataset.act;
      if (act === 'up' && index > 0) {
        [images[index - 1], images[index]] = [images[index], images[index - 1]];
      } else if (act === 'down' && index < images.length - 1) {
        [images[index + 1], images[index]] = [images[index], images[index + 1]];
      } else if (act === 'remove') {
        URL.revokeObjectURL(images[index].objectUrl);
        images.splice(index, 1);
      }
      renderList();
      updateTotalInfo();
      schedulePreview();
    });

    // 预估输出总尺寸（按当前方向）；有图片未加载完时显示加载提示
    const updateTotalInfo = () => {
      const total = $('#total-info');
      if (images.length === 0) {
        total.textContent = '';
        return;
      }
      if (hasPendingLoad()) {
        total.textContent = `共 ${images.length} 张图片，正在读取尺寸…`;
        return;
      }
      const { direction } = getSettings();
      const main = direction === 'horizontal' ? 'width' : 'height';
      const cross = direction === 'horizontal' ? 'height' : 'width';
      const mainTotal = images.reduce((sum, item) => sum + item[main], 0);
      const crossMax = Math.max(...images.map(item => item[cross]));
      total.textContent = `共 ${images.length} 张图片，预计输出 ${mainTotal}×${crossMax} 像素`;
    };

    // ============ 上传区交互 ============
    const dropzone = $('#dropzone');
    const fileInput = $('#file-input');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });

    // 拖拽
    ['dragenter', 'dragover'].forEach(evtName => {
      dropzone.addEventListener(evtName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach(evtName => {
      dropzone.addEventListener(evtName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });
    dropzone.addEventListener('drop', (e) => {
      addFiles(e.dataTransfer.files);
    });

    // 粘贴（整个页面任意位置）
    document.addEventListener('paste', (e) => {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const files = [];
      for (const item of items) {
        if (item.kind === 'file' && item.type.startsWith('image/')) {
          const file = item.getAsFile();
          if (file) files.push(file);
        }
      }
      if (files.length > 0) {
        e.preventDefault();
        addFiles(files);
      }
    });

    // ============ 设置面板联动 ============
    // 方向切换：更新对齐方式标签（横向=顶/中/底，纵向=左/中/右）
    const ALIGN_LABELS = {
      horizontal: ['顶对齐', '居中', '底对齐'],
      vertical: ['左对齐', '居中', '右对齐']
    };
    const updateAlignLabels = () => {
      const direction = document.querySelector('input[name="direction"]:checked').value;
      const labels = ALIGN_LABELS[direction];
      document.querySelectorAll('[data-align-label]').forEach((el, i) => {
        el.textContent = labels[i];
      });
    };

    // 格式切换：PNG 时禁用质量滑块
    const updateQualityState = () => {
      const format = document.querySelector('input[name="format"]:checked').value;
      const isPng = format === 'png';
      $('#quality').disabled = isPng;
      $('#quality-hint').classList.toggle('hidden', !isPng);
    };

    document.querySelectorAll('input[name="direction"]').forEach(input => {
      input.addEventListener('change', () => {
        updateAlignLabels();
        updateTotalInfo();
        schedulePreview();
      });
    });
    document.querySelectorAll('input[name="format"]').forEach(input => {
      input.addEventListener('change', () => {
        updateQualityState();
        schedulePreview();
      });
    });
    $('#quality').addEventListener('input', () => {
      $('#quality-label').textContent = `${$('#quality').value}%`;
      schedulePreview();
    });
    document.querySelectorAll('input[name="align"]').forEach(input => {
      // 注意：必须用箭头函数延迟求值，直接传 schedulePreview 会在 const 初始化前触发 TDZ
      input.addEventListener('change', () => schedulePreview());
    });

    // ============ 合并绘制 ============
    const mergeImages = () => {
      if (hasPendingLoad()) {
        throw new Error('图片仍在加载中，请稍候再试');
      }
      const { direction, format, align } = getSettings();
      const main = direction === 'horizontal' ? 'width' : 'height';
      const cross = direction === 'horizontal' ? 'height' : 'width';
      const mainTotal = images.reduce((sum, item) => sum + item[main], 0);
      const crossMax = Math.max(...images.map(item => item[cross]));

      // 画布尺寸上限检查
      const outWidth = direction === 'horizontal' ? mainTotal : crossMax;
      const outHeight = direction === 'horizontal' ? crossMax : mainTotal;
      if (outWidth > MAX_DIMENSION || outHeight > MAX_DIMENSION) {
        throw new Error(`输出尺寸 ${outWidth}×${outHeight} 超过浏览器画布上限（单边 ${MAX_DIMENSION}px），请减少图片或压缩后重试`);
      }
      if (outWidth * outHeight > MAX_PIXELS) {
        throw new Error(`输出总像素 ${outWidth * outHeight} 超过浏览器画布上限，请减少图片或压缩后重试`);
      }

      const canvas = document.createElement('canvas');
      canvas.width = outWidth;
      canvas.height = outHeight;
      const ctx = canvas.getContext('2d');

      // JPG 不支持透明：先铺白底，避免透明区域变黑
      if (format === 'jpeg') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, outWidth, outHeight);
      }

      // 交叉轴偏移：top/left=0，center=居中，bottom/right=贴边
      const alignOffset = (size, max) => {
        if (align === 'center') return Math.round((max - size) / 2);
        if (align === 'bottom') return max - size;
        return 0;
      };

      let offset = 0;
      for (const item of images) {
        const dx = direction === 'horizontal' ? offset : alignOffset(item.width, crossMax);
        const dy = direction === 'horizontal' ? alignOffset(item.height, crossMax) : offset;
        ctx.drawImage(item.img, dx, dy, item.width, item.height);
        offset += item[main];
      }
      return canvas;
    };

    // ============ 预览 ============
    let previewTimer = null;
    const schedulePreview = () => {
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        // 有图片未加载完成时静默等待（由最后一张的 onload 触发重算）
        if (images.length === 0 || hasPendingLoad()) return;
        try {
          const canvas = mergeImages();
          renderPreview(canvas);
        } catch (err) {
          showToast(err.message, false);
          clearPreview();
        }
      }, 200);
    };

    const renderPreview = (canvas) => {
      const previewCanvas = $('#preview-canvas');
      // 按比例缩放到长边约 900px 展示，避免大图预览占用过多内存
      const maxSide = 900;
      const scale = Math.min(1, maxSide / Math.max(canvas.width, canvas.height));
      previewCanvas.width = Math.max(1, Math.round(canvas.width * scale));
      previewCanvas.height = Math.max(1, Math.round(canvas.height * scale));
      const ctx = previewCanvas.getContext('2d');
      ctx.drawImage(canvas, 0, 0, previewCanvas.width, previewCanvas.height);
      $('#preview-wrap').classList.remove('hidden');
      $('#result-info').textContent = `输出尺寸：${canvas.width}×${canvas.height} 像素 · 预计文件大小约 ${formatSize(canvas.width * canvas.height * 4)}（未压缩）`;
      $('#merge-button').disabled = false;
    };

    const clearPreview = () => {
      $('#preview-wrap').classList.add('hidden');
      $('#result-info').textContent = '';
      $('#merge-button').disabled = true;
    };

    // ============ 下载 ============
    const download = (canvas) => {
      const { format, quality } = getSettings();
      const mime = { png: 'image/png', jpeg: 'image/jpeg', webp: 'image/webp' }[format];
      const ext = { png: 'png', jpeg: 'jpg', webp: 'webp' }[format];
      canvas.toBlob((blob) => {
        if (!blob) {
          // 浏览器不支持该格式编码（如部分旧版 Safari 的 WebP）
          showToast('当前浏览器不支持导出该格式，请改用 PNG 或 JPG', false);
          return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const now = new Date();
        const ts = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;
        a.href = url;
        a.download = `pintu_merged_${ts}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        showToast('已生成并开始下载', true);
      }, mime, quality);
    };

    $('#merge-button').addEventListener('click', () => {
      if (images.length === 0) return;
      try {
        const canvas = mergeImages();
        renderPreview(canvas);
        download(canvas);
      } catch (err) {
        showToast(err.message, false);
      }
    });

    // ============ 初始化 ============
    // 空列表或仍有图片未加载完成时禁用生成按钮
    const updateButtonState = () => {
      $('#merge-button').disabled = images.length === 0 || hasPendingLoad();
    };
    renderList();
    updateAlignLabels();
    updateQualityState();
  </script>
</body>

</html>
